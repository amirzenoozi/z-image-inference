[project]
name = "z-image-inference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.0.1",
    "torch>=2.9.1",
    "diffusers>=0.42.1",
    "transformers",
    "accelerate",
    "fastapi",
    "uvicorn",
    "requests",
    "openai",
    "python-dotenv",
    "mflux>=0.23.0",
    "huggingface-hub>=1.33.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
